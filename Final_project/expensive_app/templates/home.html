{% extends "layout.html" %}


{% block title %}
    Home
{% endblock %}

{% block main %}

    <h1>Your cash: {{ cash }} đ</h1>
    <h1>Trending report</h1>
    <h1><span>your cost:</span><span>{{ sum_expense }} đ</span></h1>
    <div>
        <canvas id="myChart"></canvas>
    </div>

    <h1><span>your salary:</span><span>{{ sum_salary }} đ</span></h1>
    <div>
        <canvas id="salarychart"></canvas>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // Chuyển dữ liệu từ Flask vào JavaScript
        let data = JSON.parse('{{ data | safe }}');

        // Tách cột "date" và "amount"
        let labels = data.map(item => item.date);  // Danh sách ngày
        let amounts = data.map(item => item.amount);  // Danh sách số tiền

        // Cấu hình biểu đồ
        let ctx = document.getElementById("myChart").getContext("2d");
        let myChart = new Chart(ctx, {
            type: "line", // Thay đổi thành "bar" nếu muốn biểu đồ cột
            data: {
                labels: labels,
                datasets: [{
                    label: "Amount (đ)",
                    data: amounts,
                    borderColor: "blue",
                    backgroundColor: "rgba(0, 0, 255, 0.2)",
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: "Date" } },
                    y: { title: { display: true, text: "Amount ($)" }, beginAtZero: true }
                }
            }
        });

        // Chuyển dữ liệu từ Flask vào JavaScript
        let data_salary = JSON.parse('{{ data_salary | safe }}');

        // Tách cột "date" và "amount"
        let labels_salary = data_salary.map(item => item.date);  // Danh sách ngày
        let amounts_salary = data_salary.map(item => item.amount);  // Danh sách số tiền

        // Cấu hình biểu đồ
        let salary = document.getElementById("salarychart").getContext("2d");

        let salarychart = new Chart(salary, {
            type: "line", // Thay đổi thành "bar" nếu muốn biểu đồ cột
            data: {
                labels: labels_salary,
                datasets: [{
                    label: "Amount (đ)",
                    data: amounts_salary,
                    borderColor: "blue",
                    backgroundColor: "rgba(0, 0, 255, 0.2)",
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: "Date" } },
                    y: { title: { display: true, text: "Amount ($)" }, beginAtZero: true }
                }
            }
        });
    </script>


    <!-- spending report -->
    <div>
        <h1>spending report</h1>
        <div>
            <button>Week</button>
            <button>Month</button>
        </div>
        
        <div>
            <h3 id="total_expense">Number</h3>
            <p id="describe">Total spent this month</p>
        </div>

        <div id="chart">
            <canvas id="spendingChart"></canvas>
        </div>
    </div>


    <!-- top 5 expense -->
    <div id="topSpending">
        <div>
            <button>Week</button>
            <button>Month</button>
        </div>
        <div class="listExpense" id="topspending">
            <h1>This container list of top expensive</h1>
        </div>
    </div>

    <script>
        // Chuyển dữ liệu từ Flask vào JavaScript
        let df_json_expense_group = JSON.parse('{{ df_json_expense_group | safe }}');
        // Tách cột "date" và "amount"
        let labels3 = df_json_expense_group.map(item => item.month);  // Danh sách ngày
        let amounts3 = df_json_expense_group.map(item => item.amount);  // Danh sách số tiền

        // Cấu hình biểu đồ
        let expense = document.getElementById("spendingChart").getContext("2d");

        const stackedBar = new Chart(expense, {
            type: 'bar',
            data: {
                labels: labels3,
                datasets: [{
                    label: "Amount (đ)",
                    data: amounts3,
                    borderColor: "blue",
                    backgroundColor: "rgba(0, 0, 255, 0.2)",
                    borderWidth: 2
                }]
            },
            options: {
                scales: {
                    x: {
                        stacked: true
                    },
                    y: {
                        stacked: true
                    }
                }
            }
        });        
    </script>
    <!-- <script src="/static/home.js"></script> -->


{% endblock %}
